services:
  # ── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot_secret
      POSTGRES_DB: pilot_lms
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Create the testing DB automatically on first start
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d pilot_lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Laravel app ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Application config lives in docker/app.env (mounted over .env below), not
    # here.
    #
    # Anything set in this block becomes a $_SERVER variable, and Laravel's env
    # repository consults $_SERVER before $_ENV. PHPUnit's <env force="true">
    # writes putenv() and $_ENV but not $_SERVER, so compose variables silently
    # outrank phpunit.xml — which had the test suite running at APP_ENV=local,
    # with the queue on `database`, against the development database.
    # No config:cache here.
    #
    # A cached config is frozen at container start, and nothing can override it
    # afterwards — not phpunit.xml's <env> block, not anything. That silently
    # sent the test suite at APP_ENV=local (so CSRF was enforced and every POST
    # got a 419), at QUEUE_CONNECTION=database (so queued jobs never ran), and
    # at the development database instead of pilot_lms_testing.
    #
    # It was only there to work around `artisan serve` dropping DB_HOST when it
    # spawns its child process; AppServiceProvider now adds those variables to
    # ServeCommand::$passthroughVariables instead, which fixes the cause.
    #
    # Cache config in a production image, never in a dev container.
    command: sh -c "php artisan config:clear && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8080:8000"
    volumes:
      # Mount source for live edits during dev (optional — comment out for prod-like test)
      - .:/var/www/html
      # Layered over the mount above: the host .env points at 127.0.0.1, which
      # is correct on the host and wrong inside the network.
      - ./docker/app.env:/var/www/html/.env:ro
      # Anonymous volumes to keep container-built layers for vendor/node_modules
      - /var/www/html/vendor
      - /var/www/html/node_modules

  # ── Queue worker ─────────────────────────────────────────────
  #
  # QUEUE_CONNECTION is `database`, so certificate PDFs and notification emails
  # are dispatched to a queue rather than rendered in the request that finished
  # the course. Without something draining that queue they sit in the jobs
  # table for ever and no certificate ever appears.
  #
  # Shares the app image and the same mounts, so it picks up code changes on
  # restart like everything else.
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "php artisan queue:work --tries=3 --max-time=3600 --sleep=1"
    volumes:
      - .:/var/www/html
      - ./docker/app.env:/var/www/html/.env:ro
      - /var/www/html/vendor
      - /var/www/html/node_modules

volumes:
  pgdata:
